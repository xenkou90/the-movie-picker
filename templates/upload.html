<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CSV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
<nav class="navbar navbar-dark top-bar navbar-expand-md">
    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand" href="/">
            <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
        </a>

        <!-- MOBILE HAMBURGER -->
        <button class="hamburger-animated d-md-none" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- DESKTOP NAV LINKS -->
        <div class="collapse navbar-collapse justify-content-end d-none d-md-flex">
            <a class="nav-link" href="{{ url_for('about') }}">About</a>
            <a class="nav-link" href="https://letterboxd.com/ne0n/" target="_blank">Follow me on Letterboxd!</a>
        </div>

    </div>
</nav>


    <!-- MOBILE CSV UPLOAD CONTENT -->
    <div class="container d-flex flex-column align-items-center" style="padding-top: 60px;">

        <div class="upload-card">

            <h4 class="upload-subtitle">
                Go for Pick for Me! or first upload a CSV to filter out movies you've already seen.
            </h4>

            <form method="POST" enctype="multipart/form-data" class="upload-section">
                <input type="file" name="csv_file" class="form-control mb-3">
                <button type="submit" class="btn btn-danger w-100">Upload CSV</button>
            </form>

            {% if upload_message %}
                <p class="mt-3 text-success text-center">{{ upload_message }} movies!</p>
            {% endif %}

            <form method="POST" action="/reset" class="reset-section mt-3">
                <button class="btn btn-light w-100 reset-btn-mobile">Reset CSV</button>
            </form>
        </div>
    </div>

    <!-- MOBILE MENU -->
    <div id="mobile-menu" class="mobile-menu-overlay">
        <div class="mobile-menu-content">
                <a href="/" class="mobile-menu-link">Pick for Me!</a>
                <a href="/upload" class="mobile-menu-link">Upload CSV</a>
                <a href="/about" class="mobile-menu-link">About</a>
                <a href="/guess" class="mobile-menu-link">Guess my favourite!</a>
                <a href="https://letterboxd.com/ne0n/"
                    target="_blank"
                    class="mobile-menu-link">Follow me on Letterboxd!</a>

                <button id="mobile-menu-close" class="mobile-close-btn">Close</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
