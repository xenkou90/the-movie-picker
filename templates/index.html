<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Movie Picker</title>

    <!-- BOOTSTRAP CDN-->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    >

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark top-bar">
        <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        </a>

        <!-- Right Links -->
         <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('about') }}">About</a>
            <a class="nav-link" href="https://letterboxd.com/ne0n/" target="_blank">Follow me on Letterboxd!</a>
         </div>
        </div>
    </nav>

    <!-- MAIN CONTENT 50/50 SPLIT -->
    <div class="container-fluid main-container">
        <div class="row h-100">

            <!-- Left Side -->
             <div class="col-12 col-md-6 left-side d-flex flex-column justify-content-center align-items-center">

                <button class="btn btn-danger pick-btn">Pick for me!</button>

                <!-- Placeholder for movie card -->
                <div class="movie-card mt-4">
                    <p>No movie selected yet.</p>
                </div>
             </div>

            <!-- Right Side -->
            <div class="col-12 col-md-6 right-side d-flex flex-column justify-content-center align-items-center">

                <h3 class="text-white mb-4">Upload your Letterboxd Watched Movies CSV</h3>

                <form method="POST" enctype="multipart/form-data" class="d-flex flex-column align-items-center">
                    <ipnut type="file" name="scv_file" class="form-control mb-3" style="width: 250px;">
                    <button type="submit" class="btn btn-light mb-3">Upload</button>
                </form>

                <form method="POST" action="/reset">
                    <button class="btn btn-danger">Reset CSV</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
